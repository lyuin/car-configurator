<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--

      user-scalable は指定しない = 図をピンチで拡大できる状態を維持する。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Car Silhouette Configurator</title>
  </head>

    <div id="root"></div>
